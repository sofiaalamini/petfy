<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petfy</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/512/12/12638.png" type="image/x-icon">
</head>
<body>

<!-- Tela 1 -->
<section class="tela-login" id="tela1">
    <div class="conteudo">
        <h1 class="logo">PETFY</h1>
        <button class="btn-principal" onclick="mostrarTela2()">Entrar</button>
        <button class="btn-secundario">Não tem uma conta? <span class="linha-btn-secundario">Clique aqui</span></button>
        <div class="social">
            <button class="btn-social google">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>
            <button class="btn-social facebook">f</button>
        </div>
    </div>
</section>

<!-- Tela 2 -->
<section class="tela-login" id="tela2" style="display:none;">
    <div class="conteudo">
        <h1 class="logo2">PETFY</h1>
        <input type="text" placeholder="Usuário" class="input-campo">
        <input type="password" placeholder="Senha" class="input-campo2">
        <button class="btn-principal" onclick="entrar()">Entrar</button>
        <a href="#" class="link-branco">Esqueceu a senha?</a>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
